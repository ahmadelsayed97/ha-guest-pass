name: HA Guest Pass
version: "0.2.0"
slug: ha_guest_pass
description: Scoped, password-free guest access to your Home Assistant dashboards
url: https://github.com/ahmadelsayed97/ha-guest-pass
arch:
  - amd64
  - aarch64
image: ghcr.io/ahmadelsayed97/ha-guest-pass-{arch}
startup: services
host_network: true
homeassistant_api: true
watchdog: http://[HOST]:8124/health
options: {}
schema:
  admin_secret: "password?"
  ha_url: "url?"
