configuration:
  ha_url:
    name: Home Assistant URL
    description: Where the add-on reaches Home Assistant. With host networking the default works.
  ha_token:
    name: Long-lived access token
    description: Created under your profile, Security tab. Stays inside the add-on.
  admin_secret:
    name: Admin secret
    description: At least 32 characters. Unlocks the /admin page where you create guests.
